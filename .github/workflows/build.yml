name: Build XJ380 IMG + ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install full system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang lld nasm ninja-build \
            mtools gdisk dosfstools \
            qemu-system-x86 qemu-utils ovmf \
            python3 \
            gcc-mingw-w64-x86-64 \
            xorriso

      - name: Setup Rust (with x86_64-unknown-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Generate build.ninja
        run: python3 tools/gen_ninja.py --out build.ninja

      - name: Check all build tools
        run: ninja -f build.ninja check.tools

      - name: List all ninja targets（调试，查看可用目标）
        run: ninja -f build.ninja -t targets

      - name: Build disk.img
        run: ninja -f build.ninja disk.img

      - name: Build boot.iso
        run: ninja -f build.ninja boot.iso

      - name: List all generated files
        run: ls -la

      - name: Upload artifacts (img + iso)
        uses: actions/upload-artifact@v4
        with:
          name: xj380-${{ github.sha }}-artifacts
          path: |
            disk.img
            boot.iso
          retention-days: 14

      - name: Upload to Release (only tag push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            disk.img
            boot.iso
          generate_release_notes: true
          draft: false
          prerelease: false
