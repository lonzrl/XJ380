name: Build XJ380 IMG & ISO Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install all system dependencies (Full for IMG+ISO)
        run: |
          sudo apt update
          sudo apt install -y \
            clang lld nasm ninja-build \
            mtools gdisk dosfstools \
            qemu-system-x86 qemu-utils ovmf \
            python3 \
            gcc-mingw-w64-x86-64 \
            xorriso

      - name: Setup Rust (with x86_64-unknown-none target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Generate build.ninja
        run: python3 tools/gen_ninja.py --out build.ninja

      - name: Check all build tools
        run: ninja -f build.ninja check.tools

      - name: Build project, generate IMG + ISO
        run: ninja -f build.ninja

      - name: List output artifacts
        run: ls -la

      - name: Upload IMG & ISO to Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xj380-${{ github.sha }}-artifacts
          path: |
            ./*.img
            ./*.iso
          retention-days: 14

      - name: Upload IMG & ISO to GitHub Release (only tag push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ./*.img
            ./*.iso
          generate_release_notes: true
          draft: false
          prerelease: false
