name: Build XJ380 IMG Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: # 支持手动触发构建

permissions:
  contents: write # 用于Release上传文件

jobs:
  build-img:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install build dependencies (XJ380)
        run: |
          sudo apt update
          sudo apt install -y \
            clang lld nasm ninja-build \
            mtools gdisk dosfstools \
            qemu-system-x86 qemu-utils ovmf \
            python3

      - name: Generate build.ninja
        run: python3 tools/gen_ninja.py --out build.ninja

      - name: Check build toolchain
        run: ninja -f build.ninja check.tools

      - name: Build project & generate IMG
        run: ninja -f build.ninja

      - name: List build artifacts
        run: ls -la

      - name: Upload IMG to Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xj380-${{ github.sha }}-img
          # 修改为你的img实际输出路径，例如 out/*.img
          path: ./*.img
          retention-days: 14

      - name: Upload IMG to GitHub Release (only tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # 和上面artifact路径保持一致
          files: ./*.img
          generate_release_notes: true
          draft: false
          prerelease: false
