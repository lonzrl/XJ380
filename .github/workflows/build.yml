name: OpenXJ380 CI Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang lld nasm ninja-build \
            mtools gdisk dosfstools \
            qemu-system-x86 qemu-utils ovmf xorriso \
            python3 python3-pip \
            gcc-mingw-w64-x86-64

      - name: Install Rust bare‑metal target
        run: rustup target add x86_64-unknown-none

      - name: Verify toolchain
        run: |
          clang --version
          ld.lld --version
          nasm -v
          ninja --version
          python3 --version
          x86_64-w64-mingw32-gcc --version
          rustup show

      - name: Generate ninja build graph
        run: python3 tools/gen_ninja.py --out build.ninja

      - name: Check host tools availability
        run: ninja -f build.ninja check.tools

      - name: Build all targets
        run: ninja -f build.ninja all

      - name: Build kernel modules
        run: ninja -f build.ninja kmods

      - name: Generate UEFI boot disk image XJ380.img
        run: |
          export SUDO=0
          ninja -f build.ninja vdisk

      - name: Debug - Print working dir & all files
        run: |
          pwd
          ls -la
          ls -la out/ 2>/dev/null || echo "out目录不存在"

      - name: Upload raw disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenXJ380‑disk‑image
          path: |
            ./XJ380.img
            ./out/
          retention-days: 14
          if-no-files-found: error

      - name: Optional convert raw image to ISO
        if: false
        run: |
          sudo apt install -y genisoimage
          genisoimage -o OpenXJ380.iso -efi-boot-part --efi-boot-image XJ380.img

      - name: Upload ISO artifact (if generated)
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: OpenXJ380‑iso
          path: ./OpenXJ380.iso
          retention-days: 14
          if-no-files-found: error