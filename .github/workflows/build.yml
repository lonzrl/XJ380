name: Build XJ380 Full (check.tools pass + XJ380.img)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install ALL required system packages
        run: |
          sudo apt update
          sudo apt install -y \
            clang lld nasm ninja-build \
            mtools gdisk dosfstools \
            qemu-system-x86 qemu-utils ovmf \
            python3 \
            gcc-mingw-w64-x86-64 \
            xorriso

      - name: Setup Rust with x86_64-unknown-none target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Generate build.ninja
        run: python3 tools/gen_ninja.py --out build.ninja

      - name: Check all build tools (now all satisfied)
        run: ninja -f build.ninja check.tools

      - name: Build all binaries
        run: ninja -f build.ninja all

      - name: Build vdisk -> XJ380.img
        run: |
          SUDO=1 ninja -f build.ninja vdisk

      - name: List generated files
        run: ls -la

      - name: Upload XJ380.img to artifact
        uses: actions/upload-artifact@v4
        with:
          name: xj380-${{ github.sha }}-img
          path: XJ380.img
          retention-days: 14

      - name: Upload to GitHub Release (only tag push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: XJ380.img
          generate_release_notes: true
          draft: false
          prerelease: false
