name: Build XJ380 & Generate XJ380.img

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies (match README)
        run: |
          sudo apt update
          sudo apt install -y \
            clang lld nasm ninja-build \
            mtools gdisk dosfstools \
            qemu-system-x86 qemu-utils ovmf \
            python3

      - name: Generate build.ninja
        run: python3 tools/gen_ninja.py --out build.ninja

      - name: Check build toolchain
        run: ninja -f build.ninja check.tools

      - name: Build all binaries
        run: ninja -f build.ninja all

      - name: Build vdisk → XJ380.img
        run: |
          # 开启SUDO=1，满足分区与文件系统写入权限
          SUDO=1 ninja -f build.ninja vdisk

      - name: List files (verify XJ380.img exists)
        run: ls -la

      - name: Upload XJ380.img to artifact
        uses: actions/upload-artifact@v4
        with:
          name: xj380-${{ github.sha }}-img
          path: XJ380.img
          retention-days: 14

      - name: Upload XJ380.img to GitHub Release (tag only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: XJ380.img
          generate_release_notes: true
          draft: false
          prerelease: false
